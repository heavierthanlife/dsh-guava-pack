# ⚠️ 这是**模板**，不是可直接生效的文件。
#    用法：把内容合并进 <profile>/cordis.patch.yml（本机是 profiles/web/cordis.patch.yml）。
#
# 来源：本机 profiles/web/cordis.patch.yml（原 dsh-home 仓库已删除，这里保留的是最终版）
#   6 家 provider、24 个模型（只留常用的，其余按需删过），
#   全部经本机路由代理 http://127.0.0.1:8318/<provider>
# 密钥：只写环境变量名（apiKeyEnv: XIAOMI_TOKEN_PLAN_CN_API_KEY 等），
#   不含任何明文 key —— 换机后设好对应环境变量即可。
# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
    fontSize: 17
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      xiaomi-token-plan-cn:
        apiKeyEnv: XIAOMI_TOKEN_PLAN_CN_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8318/xiaomi-token-plan-cn
        models:
          - id: mimo-v2.6-pro
            name: MiMo-V2.6-Pro
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
            compat:
              supportsStrictMode: true
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek
          - id: mimo-v2.6-flash
            name: MiMo-V2.6-Flash
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
            compat:
              supportsStrictMode: true
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8318/opencode-go
        # 不要在这里写死 x-opencode-session：该 header 由插件
        # dsh-opencode-session-header 按会话动态注入。写死会让所有机器共用同一个
        # session，破坏 prompt cache 亲和性（也会把真实 session id 分发出去）。
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              maxTokensField: max_tokens
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek
              supportsStrictMode: true
      antigravity:
        apiKeyEnv: ANTIGRAVITY_API_KEY
        displayName: Antigravity (本地 127.0.0.1:8045)
        api: anthropic-messages
        baseURL: http://127.0.0.1:8045
        thinkingBudgets:
          minimal: 2048
          low: 8192
          medium: 16384
          high: 32768
        compat:
          supportsEagerToolInputStreaming: false
          supportsLongCacheRetention: false
        models:
          - id: claude-sonnet-4-6
            name: Claude Sonnet 4.6 (Antigravity)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: claude-opus-4-6-thinking
            name: Claude Opus 4.6 Thinking (Antigravity)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: gemini-3.8-flash-high
            name: Gemini 3.8 Flash High (Antigravity)
            contextWindow: 1000000
            maxTokens: 65536
            input:
              - text
              - image
          - id: gemini-3.8-flash-tiered
            name: Gemini 3.8 Flash Tiered (Antigravity)
            contextWindow: 1000000
            maxTokens: 65536
            input:
              - text
              - image
          - id: gemini-3.1-flash-image
            name: Gemini 3.1 Flash Image (Antigravity)
            contextWindow: 1000000
            maxTokens: 65536
            input:
              - text
              - image
      agentrouter:
        apiKeyEnv: AGENTROUTER_API_KEY
        displayName: AgentRouter (经路由代理 · SSR · Anthropic 协议)
        api: anthropic-messages
        baseURL: http://127.0.0.1:8318/agentrouter
        thinkingBudgets:
          low: 8192
          medium: 16384
          high: 32768
        compat:
          allowEmptySignature: true
          supportsLongCacheRetention: false
          supportsEagerToolInputStreaming: false
          supportsCacheControlOnTools: false
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 131072
            input:
              - text
            reasoningEfforts:
              low: low
              medium: medium
              high: high
      commandcode:
        apiKeyEnv: COMMANDCODE_API_KEY
        displayName: CommandCode (本地桥接 / Go 套餐)
        api: openai-completions
        baseURL: http://127.0.0.1:8317/v1
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              max: max
          - id: inclusionai/ling-3.1-flash:free
            name: Ling 3.1 Flash
            contextWindow: 262144
            maxTokens: 32768
            input:
              - text
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: stealth/glyph-cluster:free
            name: Glyph Cluster
            contextWindow: 256000
          - id: poolside/laguna-s-2.1-free
            name: Laguna S 2.1
            contextWindow: 256000
          - id: inclusionai/ling-3.0-flash-sante:free
            name: Ling 3.0 Flash Sante
            contextWindow: 262144
      opencode:
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/v1
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: ling-3.1-flash-free
            name: Ling 3.1 Flash (free)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: mimo-v2.6-flash-free
            name: Mimo V2.6 Flash (free)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: muse-spark-1.2-contributor-free
            name: Muse Spark 1.2 Contributor (free)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: muse-spark-1.3-contributor-free
            name: Muse Spark 1.3 Contributor (free)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: nemotron-3.5-lightning-free
            name: Nemotron 3.5 Lightning (free)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: jev-1.13-free
            name: Jev 1.13 (free)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: step-5-preview-free
            name: Step 5 Preview (free)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: longcat-2.5-preview-free
            name: Longcat 2.5 Preview (free)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: space-bunny-free
            name: Space Bunny (free)
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: xiaomi-token-plan-cn
    model: mimo-v2.6-pro
    reasoningEffort: high
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
# ── 主题插件开关 ────────────────────────────────────────────────
# 只保留赛博朋克主题；dsh-bloom-theme / dsh-theme-plugin（中国传统颜色）已卸载，
# 对应的孤儿条目已删除。dsh-catppuccin / dsh-theme-endfield 依赖 0.1.7 已移除的
# settingsScope 服务，也未安装。
- id: theme-manager
  disabled: false
- id: ui-theme-cyberpunk
  disabled: false

# ── Subagent 模型授权（等价于 设置 → 子代理 → 模型选择）─────────────
# 注意：策略在会话启动时固化，仅对新会话生效。
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - provider: xiaomi-token-plan-cn
        model: mimo-v2.6-pro
      - provider: deepseek
        model: deepseek-flash
      - provider: deepseek
        model: deepseek-v4-pro
      - provider: agentrouter
        model: deepseek-v4-flash
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
