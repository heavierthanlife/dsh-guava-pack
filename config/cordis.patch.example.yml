# ⚠️ 这是**模板**，不是可直接生效的文件。
#    用法：把内容合并进 <profile>/cordis.patch.yml（本机是 profiles/web/cordis.patch.yml）。
#
# 来源：本机 profiles/web/cordis.patch.yml 的当前状态（2026-10-19）
#   6 家 provider、21 个模型 —— 由 tools/sync-model-policy.mjs 按 config/model-policy.yml
#   的策略维护（免费模型是**真调探测**过的，失效的已剔除；见该策略表的 free_notices）。
#   全部经本机路由代理 http://127.0.0.1:8318/<provider>
# 密钥：只写环境变量名（apiKeyEnv: XIAOMI_TOKEN_PLAN_CN_API_KEY 等），
#   不含任何明文 key —— 换机后设好对应环境变量即可。
#
# 重新生成：改完策略表后跑 `node tools/sync-model-policy.mjs --write`，
#   再把 ~/dsh/profiles/web/cordis.patch.yml 按上面同样的脱敏方式复制过来。
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: dark
    fontSize: 16
    codeFontSize: 14
    terminalFontSize: 15
    textFontFamily: ""
    codeFontFamily: ""
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      xiaomi-token-plan-cn:
        apiKeyEnv: XIAOMI_TOKEN_PLAN_CN_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8318/xiaomi-token-plan-cn
        models:
          - id: mimo-v2.6-pro
            name: MiMo-V2.6-Pro
            contextWindow: 1048576
            maxTokens: 131072
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
            compat:
              supportsStrictMode: true
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:8318/opencode-go
        headers:
          # 不要在这里写死 x-opencode-session：该 header 由插件
          # dsh-opencode-session-header 按会话动态注入。写死会让所有机器共用同一个
          # session，破坏 prompt cache 亲和性（也会把真实 session id 分发出去）。
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              high: high
              max: max
            compat:
              supportsStore: false
              supportsDeveloperRole: false
              maxTokensField: max_tokens
              requiresReasoningContentOnAssistantMessages: true
              thinkingFormat: deepseek
              supportsStrictMode: true
      antigravity:
        apiKeyEnv: ANTIGRAVITY_API_KEY
        displayName: Antigravity (本地 127.0.0.1:8045)
        api: anthropic-messages
        baseURL: http://127.0.0.1:8045
        thinkingBudgets:
          minimal: 2048
          low: 8192
          medium: 16384
          high: 32768
        compat:
          supportsEagerToolInputStreaming: false
          supportsLongCacheRetention: false
        models:
          - id: claude-opus-4-6-thinking
            name: Claude Opus 4.6 Thinking
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: claude-sonnet-4-6
            name: Claude Sonnet 4.6
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: gemini-3.8-flash-high
            name: Gemini 3.8 Flash High（固定推理档）
            contextWindow: 1000000
            maxTokens: 65536
            input:
              - text
              - image
          - id: gemini-3.8-flash-tiered
            name: Gemini 3.8 Flash Tiered（固定推理档）
            contextWindow: 1000000
            maxTokens: 65536
            input:
              - text
              - image
          - id: gemini-3.1-flash-image
            name: Gemini 3.1 Flash Image（图像生成）
            contextWindow: 1000000
            maxTokens: 65536
            input:
              - text
              - image
      # ── AgentRouter · Anthropic 协议路由：**已废弃（2026-10-27）** ────────
      # 2026-10-27 实测（经 SSR、带合法 UA）：
      #   · GET /v1/models 只剩 3 个模型，全部是 Responses-only；
      #   · 原 Anthropic 路由唯一的 deepseek-v4-flash 已下线 →
      #     503「当前分组 default 下对于模型 deepseek-v4-flash 无可用渠道」。
      # 所以这里不再保留 anthropic-messages 路由（留着只会让用户选到必失败的模型）。
      # 若上游将来重新提供 Anthropic 协议模型，按被删块的形状加回即可。
      # ── AgentRouter · Responses API（走工具能力必须用这条路由）──────────
      # 为什么单独开一家：AgentRouter 的 Anthropic 适配层会把 /v1/messages 翻成
      # OpenAI /v1/chat/completions，而 gpt-6.1-sol 在该端点上**禁止 Function
      # tools**（上游硬限制）。同一个模型走 /v1/responses 则完全支持工具调用。
      agentrouter-responses:
        apiKeyEnv: AGENTROUTER_API_KEY
        displayName: AgentRouter (Responses API · 支持工具)
        api: openai-responses
        baseURL: http://127.0.0.1:8318/agentrouter/v1
        # 2026-10-27 线上目录实测只剩这三个，且**都只能走 /v1/responses**：
        # 同模型在 /v1/chat/completions 上一律 400（原文：请改用 /v1/responses），
        # 在 /v1/responses 上工具调用正常（实测 function_call）。
        # 目录不提供上下文长度（created 还是 one-api 的假时间戳 1626777600），
        # 除 gpt-6.1-sol 外按保守 1M 记录。
        models:
          - id: gpt-6.1-sol
            name: GPT 6.1 Sol
            contextWindow: 1050000
            maxTokens: 64000
            input:
              - text
              - image
          - id: gpt-5.6-sol
            name: GPT 5.6 Sol
            contextWindow: 1000000
            maxTokens: 64000
            input:
              - text
              - image
          - id: gpt-6-astra
            name: GPT 6 Astra
            contextWindow: 1000000
            maxTokens: 64000
            input:
              - text
              - image
      commandcode:
        apiKeyEnv: COMMANDCODE_API_KEY
        displayName: CommandCode (本地桥接 / Go 套餐)
        api: openai-completions
        baseURL: http://127.0.0.1:8317/v1
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              max: max
          - id: reflection/beam:free
            name: Beam 1.0（推理型·1M上下文）
            contextWindow: 1048576
            maxTokens: 64000
            input:
              - text
              - image
          - id: minimax/minimax-m3.1-flash:free
            name: MiniMax M3.1 Flash（限时免费·1M）
            contextWindow: 1000000
            maxTokens: 64000
            input:
              - text
              - image
          - id: stealth/glyph-cluster:free
            name: Glyph Cluster（仅推理，不出正文）
            contextWindow: 256000
          - id: poolside/laguna-s-2.1-free
            name: Laguna S 2.1（免费但常满载）
            contextWindow: 256000
      opencode:
        apiKeyEnv: OPENCODE_GO_API_KEY
        api: openai-completions
        baseURL: https://opencode.ai/zen/v1
        models:
          - id: deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            maxTokens: 384000
            input:
              - text
            reasoningEfforts:
              low: low
              high: high
              max: max
          - id: nemotron-3.5-lightning-free
            name: Nemotron 3.5 Lightning
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: mimo-v2.6-flash-free
            name: Mimo V2.6 Flash
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
          - id: longcat-2.5-preview-free
            name: Longcat 2.5 Preview
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: jev-1.13-free
            name: Jev 1.13
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: muse-spark-1.3-contributor-free
            name: Muse Spark 1.3 Contributor
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: muse-spark-1.2-contributor-free
            name: Muse Spark 1.2 Contributor
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
          - id: space-bunny-free
            name: Space Bunny
            contextWindow: 200000
            maxTokens: 64000
            input:
              - text
              - image
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: antigravity
    model: gemini-3.8-flash-tiered
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: cordis
# ── 联网搜索后端：钉到可切换的 provider ─────────────────────────────
# dsh-base 默认 `searchProvider: deepseek-official`（写死官方）。钉成 `switch`
# 之后，可在 设置 → 搜索后端 里一键在「官方 DeepSeek / Tavily」之间切换，
# 无需重启（偏好存 <DSH_HOME>/storages/web-search-switch.json，每次搜索热读）。
- id: web
  config:
    searchProvider: switch
    fetchProvider: http
# ── 主题插件开关 ────────────────────────────────────────────────
# 只保留赛博朋克主题；dsh-bloom-theme / dsh-theme-plugin（中国传统颜色）已卸载，
# 对应的孤儿条目已删除。dsh-catppuccin / dsh-theme-endfield 依赖 0.1.7 已移除的
# settingsScope 服务，也未安装。
- id: theme-manager
  disabled: false
- id: ui-theme-cyberpunk
  disabled: false

# ── Subagent 模型授权（等价于 设置 → 子代理 → 模型选择）─────────────
# 注意：策略在会话启动时固化，仅对新会话生效。
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - provider: xiaomi-token-plan-cn
        model: mimo-v2.6-pro
      - provider: deepseek-official
        model: deepseek-flash
      - provider: deepseek-official
        model: deepseek-v4-pro
      # AgentRouter 的 Anthropic 路由已废弃（deepseek-v4-flash 下线），改指 Responses 路由
      - provider: agentrouter-responses
        model: gpt-5.6-sol
      - provider: antigravity
        model: gemini-3.8-flash-high
      - provider: antigravity
        model: claude-sonnet-4-6
      # commandcode 的 DeepSeek V4.1 Flash（1M 窗口，工具调用实测可用）
      - provider: commandcode
        model: deepseek/deepseek-v4.1-flash
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
