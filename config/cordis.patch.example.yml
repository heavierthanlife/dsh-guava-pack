# ── 主题插件开关 ────────────────────────────────────────────────
# 只保留赛博朋克主题；dsh-bloom-theme / dsh-theme-plugin（中国传统颜色）已卸载，
# 对应的孤儿条目已删除。dsh-catppuccin / dsh-theme-endfield 依赖 0.1.7 已移除的
# settingsScope 服务，也未安装。
- id: theme-manager
  disabled: false
- id: ui-theme-cyberpunk
  disabled: false

# ── Subagent 模型授权（等价于 设置 → 子代理 → 模型选择）─────────────
# 注意：策略在会话启动时固化，仅对新会话生效。
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - provider: xiaomi-token-plan-cn
        model: mimo-v2.6-pro
      - provider: deepseek
        model: deepseek-v41-flash
      - provider: deepseek
        model: deepseek-v4-pro
      - provider: agentrouter
        model: deepseek-v4-flash
- id: llm-deepseek
  name: "@deepseek-ai/dsh-llm-deepseek-api-key"
  config:
    models:
      - id: deepseek-flash
        name: DeepSeek V4.1 Flash
        contextWindow: 1000000
        inputModalities:
          - text
          - image
        systemPromptUpdate: in-history
        toolUpdate: addition-only
      - id: deepseek-v4-pro
        name: DeepSeek V4 Pro
        description: Stronger agentic coding, knowledge, and difficult reasoning; suited
          to complex or quality-critical tasks at higher cost.
        contextWindow: 1000000
        inputModalities:
          - text
