# model-policy.yml — 我对各家供应商"要哪些模型"的固定意图
#
# ── 这是什么 ────────────────────────────────────────────────────────────────
#
# `tools/sync-model-policy.mjs` 读这份文件 + 各端点现状，算出**目标模型清单**，
# 与 profile 里现有的对比后按需增删。这样"我的模型列表"是可复现的：
# 换台机器、或者端点换了茬，跑一次就回到这个意图，不用凭记忆手工挑。
#
# 与 `sync-models.mjs` 的分工：
#   · `sync-models.mjs`      —— 只"补新的"，**默认一个都不删**（保守）
#   · `sync-model-policy.mjs` —— 按**策略**增删到目标清单（激进，但意图明确）
#
# ── 重要前提：端点给不出"谁更好" ─────────────────────────────────────────────
#
# 实测 6 家 `/models` 只回 `id` / `name` / `created` / `context`，
# **没有任何能力字段**（无视觉、无思考强度、无"旗舰"标记）。
# 而且 `created` 是**假时间戳** —— agentrouter 全是 1626777600（2021-07-20），
# 其余三家各自也全是同一个数 → **不能用来排"最新"**。
#
# 所以规则只能基于：**id 里的版本号 + 关键词 + 你的人工指定**。
# 下面每条 `intent` 是给你看的（人话），`pick` 是给程序执行的（可判定）。
#
# ── 硬保护（写死在脚本里，不在这里配）──────────────────────────────────────
#
# 任何被别的条目引用的模型 **一律不删**，即使策略说不要：
#   · `agent-default-model.config` 的 provider/model（**本机现在指着一个免费模型**）
#   · `subagent-model-selection-settings.allowedModels` 的每条路由
# 理由：删了会让主 agent 没有默认模型 / 子代理路由报 "is not allowed for this Session"。
# 脚本每次都会打印这些"被引用因此保留"的条目。
#
# ── 用法 ────────────────────────────────────────────────────────────────────
#
#   node tools/sync-model-policy.mjs                 # 预览 diff（默认，不写盘）
#   node tools/sync-model-policy.mjs --write         # 落盘（自动备份）
#   node tools/sync-model-policy.mjs --only xiaomi-token-plan-cn
#   node tools/sync-model-policy.mjs --check-refs    # 只做引用完整性检查，不改任何东西

version: 1

# 全局开关
defaults:
  # 端点查不到任何模型时怎么办：`keep` 保留现有（安全）/ `clear` 清空
  on_probe_failure: keep
  # 新增模型是否自动配 reasoningEfforts（按 tools/lib/model-config.mjs 的家族表）
  auto_reasoning_efforts: true
  # 非对话模型一律排除（tts/asr/embed/image-gen 这类，选模型时是噪音）
  exclude: '(tts|asr|voiceclone|voicedesign|embed|rerank|moderation)'
  # 大小写不敏感（JS 的 RegExp 不支持 Python 那种内联 (?i)）
  exclude_flags: 'i'

providers:

  # ── 小米 token plan ───────────────────────────────────────────────────────
  # 意图：mimo 系列里一直用**可用范围内最新的旗舰**；
  #       旗舰有视觉就只要旗舰；旗舰没有视觉就额外保留一个视觉型号。
  xiaomi-token-plan-cn:
    intent: mimo 最新旗舰（有视觉就只要它；没视觉再补一个视觉型号）
    pick:
      family: '^mimo-'
      # **关键**：取最新的一个，不是 family 全部匹配。
      # 少了这行会把 mimo-v2.5 / v2.5-pro 这些旧旗舰一起留下（踩过）。
      take: latest
      # 旗舰关键词的优先级（从高到低）
      flagship: ['pro']
      # 排除非对话
      exclude: ['-asr', '-tts', '-voiceclone', '-voicedesign']
      # true = 只留最新的旗舰；若它不带视觉，再额外留一个最新的视觉型号
      flagship_only_if_vision: true
      # 视觉判断：**先读现有条目里人工写的 input:**（真数据），
      # 只有 profile 里还没有的新模型才用这些 id 关键词兜底。
      vision_hints: ['vl', 'vision', 'omni', 'image']

  # ── antigravity（反代）─────────────────────────────────────────────────────
  # 意图：反代能提供的、我认定的最好的五个 —— **人工点名，不用启发式**。
  #       这五个是 2026-10-15 定的；反代换茬时脚本会报告"点名的某个不见了"，
  #       由你决定换成哪个（脚本不会自己乱选）。
  antigravity:
    intent: 人工点名的五个（思考旗舰 / 通用 / 高推理 gemini / tiered / 图像）
    pick:
      explicit:
        - claude-opus-4-6-thinking
        - claude-sonnet-4-6
        - gemini-3.8-flash-high
        - gemini-3.8-flash-tiered
        - gemini-3.1-flash-image
      # 端点没列出点名的型号时：keep = 保留（可能被服务端别名）/ drop = 删掉
      on_missing: keep

  # ── agentrouter ───────────────────────────────────────────────────────────
  # 意图：最新的可用 ds + gpt-6.1-sol
  agentrouter:
    intent: 最新的可用 deepseek 与 gpt-6.1-sol
    pick:
      explicit:
        - deepseek-v4-flash
        - gpt-6.1-sol
      on_missing: keep

  # ── opencode-go / opencode / commandcode ──────────────────────────────────
  # 意图：除了 ds，只要**最新的可用的免费模型**。
  #       这三家都同时提供付费与免费；免费的量足够日常用，付费的不用列出来占位。
  opencode-go:
    intent: 最新的 ds + **所有探测过真能用的**免费模型
    pick:
      family: '^deepseek'
      take: latest
      # usable = 留下所有"真调得通"的免费模型（靠 --probe 判断，见 probe.mjs）。
      # 端点列表会撒谎：实测同列表里混着 No endpoints found / 已下线转付费 / 上游满载。
      plus_free: usable

  opencode:
    intent: 最新的 ds + **所有探测过真能用的**免费模型
    pick:
      family: '^deepseek'
      take: latest
      plus_free: usable

  commandcode:
    intent: 最新的 ds + **所有探测过真能用的**免费模型
    pick:
      family: '^deepseek'
      take: latest
      plus_free: usable
      # commandcode 的 id 常带 `vendor/` 前缀；family 匹配会自动去前缀
      exclude: []

    # ── 免费额度公告（**端点完全不提供这些信息**，只能人工记）──────────────
    #
    # `/models` 只回 id/name/created/context，**没有额度字段**；我的探针也只能测
    # "此刻能不能调通"，测不出"每天几次"。这些数字来自 commandcode 的 UI 公告。
    #
    # 用途：① 打印在扫描结果里，方便你判断留哪个；
    #       ② 影响**排序** —— 无上限的排在前面（UI 选择器里第一个就是最优选）。
    #
    # `quota` 取值：unlimited（不计次/不计 credits）/ 数字+单位 / unknown
    # 注：公告都带"while the stealth preview lasts" —— 是**限时**的，随时可能变。
    free_notices:
      # Beam 排**免费模型第一位**：实测 1M 上下文、会推理（27 个推理块答对 17×23）、
      # 正文正常、中文流利（递归解释用了俄罗斯套娃比喻）。综合能力明显强于另两个。
      # 它也是 commandcode 自家模型（`owned_by: command-code`，自称 CommandCodeBot）。
      # 官方公告：is free, with no daily request limit. Requests on this model cost no credits. while capacity lasts.
      - model: 'reflection/beam:free'
        quota: unlimited
        note: '无每日请求上限、不计 credits（while capacity lasts）；1M 上下文；推理型但正文正常；中文好。综合最强的免费模型 → 排第一'
        priority: top

      # 官方公告：is free for a limited time, with no daily request limit. Requests on this model cost no credits. for a limited time.
      - model: 'minimax/minimax-m3.1-flash:free'
        quota: unlimited
        note: '限时免费、无每日请求上限、不计 credits（for a limited time）；1M 上下文'

      - model: 'stealth/cat-jam:free'
        quota: unlimited
        note: '免费且无每日请求上限，不计 credits（stealth 预览期内）'
      - model: 'stealth/glyph-cluster:free'
        quota: 100/day
        note: '免费，每天上限 100 次（while the stealth preview lasts）'
      - model: 'poolside/laguna-s-2.1-free'
        quota: unlimited
        note: '免费、不计 credits，但注明"while capacity lasts" —— 上游满载时不可用（实测探测到 capacity）'
        # 虽然无上限，但当前满载 → 排到最后
        priority: low

# ── 视觉推断表 ──────────────────────────────────────────────────────────────
# 端点上**没有**视觉字段（实测 6 家都没有），所以只能按 id 关键词推断。
# 这直接影响"旗舰没视觉时要补一个视觉型号"这条规则。
# 判断错的代价：某个模型被标成非视觉 → 会在有个"看图"需求时选不到它。
# 宁可多标几个（下面的 hint 都是明确表示多模态的词）。
vision_hints: ['vl', 'vision', 'omni', 'image', 'multimodal']

# ── 版本号抽取 ──────────────────────────────────────────────────────────────
# 用来判"最新"。从 id 里抓版本数字段：`gemini-3.8-flash-high` → [3,8]
# `deepseek-v4.1-flash` → [4,1]；`claude-opus-4-6` → [4,6]。
# 注意：这是**启发式**，端点不给真实发布时间（created 是假的）。
version_patterns:
  - 'v(\d+(?:\.\d+)*)'          # v4 / v4.1
  - '(\d+(?:\.\d+)*)'           # 3.8 / 4-6（连字符数字由 normalize 处理）

# ── 模型用途标注（显示在模型列表里）────────────────────────────────────────
#
# ## 为什么要标注
#
# 模型选择器**只显示 `name` 字段**（实测 dsh-client-ui-model-selection：只渲染
# `model.name`，`title` 也是它；pi-ai 的 schema 里连 `description` 都没有）。
# 所以"这是特殊用途模型"这件事**只能写进 name 的后缀**，形如：
#
#     Cat Jam（仅推理，不出正文）
#
# ## 为什么需要
#
# 有些模型**功能很独特但干不了常规对话/编程**。最典型的是推理型：
# `stealth/glyph-cluster:free` 实测把 `max_tokens` 全花在内部推理上
# （`reasoning_tokens: 45/50`），**正文 0 字符**，`finish_reason: length`。
# 在 DSH 里跑就是 `The stealth model could not complete the request. PI_AI_ERROR`。
# 光看名字"Glyph Cluster"完全看不出这一点，选它当默认模型会反复失败。
#
# ## 字段
#
#   match: 匹配 model.id 的正则（去 vendor 前缀后的裸 id 也试）
#   tag:   括号里显示的文字
#   why:   写给自己看的解释（不显示）
#
# 顺序敏感：第一条匹配的生效，所以把更具体的放前面。
#
# `strip`：写进 name 前要**剥掉**的既有括号内容（正则）。
# 用户 2026-10-16 明确："手写的 Antigravity 不用保留" —— 模型 id 里已经能看出
# 是哪家的，name 里重复标一遍是噪音。`(free)` 也一并剥掉（免费与否看 id 的
# `free` 后缀即可，且在 UI 里不是决策依据）。
# ⚠️ 只剥这些"纯归属/重复"标记；像 `(Antigravity)` 这种如果哪天你想留，
# 从下面删掉即可。
strip:
  - '^Antigravity$'
  - '^free$'

annotations:
  - match: '^glyph-cluster'
    tag: '仅推理，不出正文'
    why: '实测 reasoning_tokens 吃光额度、content 为 0 字符 → DSH 会报 PI_AI_ERROR。不适合常规对话/编程。'

  - match: '^cat-jam'
    tag: '仅推理·正文极简'
    why: '同样偏推理，但正文会出（实测 contentChars=2、finish=stop）。可当"想问题"用，常规编码别指望。'

  - match: '^beam'
    tag: '推理型·1M上下文'
    why: 'commandcode 自家模型。推理型但正文正常，中文好。综合最强的免费模型。'

  - match: '^minimax-m3\.1-flash'
    tag: '限时免费·1M'
    why: '官方限时免费，无每日上限不计 credits，1M 上下文通用模型。'

  - match: '^laguna-s-2.1'
    tag: '免费但常满载'
    why: '官方公告"while capacity lasts"；实测探到 capacity。留着备用，别当主力。'

  - match: 'flash-image|image$'
    tag: '图像生成'
    why: '图像模型，不是对话模型。'

  - match: '-(asr|tts|voiceclone|voicedesign)$'
    tag: '语音'
    why: '语音相关，非对话。'

  - match: '-(high|low|medium|tiered)$'
    tag: '固定推理档'
    why: '档位已写死在模型里（id 后缀），UI 里不需要再选 effort。'
