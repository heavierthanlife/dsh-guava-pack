<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d10">
<title>贪吃蛇 · 休闲角</title>
<link rel="stylesheet" href="shared.css">
<script src="arcade.js"></script>
<script>Arcade.initTheme({ page: 'snake', accent: 'mint' });</script>
<style>
  .hud {
    display: flex;
    gap: 10px;
    width: min(88vw, 420px);
    max-width: 100%;
    margin: 0 auto 14px;
  }
  .stat {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
  }
  .stat strong {
    font-size: 18px;
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  /* ── 页内最高分行 / "有存档"提示条 / 存档面板里的行 ─────────────
   * rec-row 与首页记录管理同形（shared.css 没导出这个类，所以本页自带一份）。
   */
  #score-row,
  .resume {
    width: min(88vw, 420px);
    max-width: 100%;
    margin: 0 auto 12px;
  }

  .resume {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px 8px 12px;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent-soft);
  }
  .resume .small { flex: 1 1 auto; min-width: 0; line-height: 1.4; color: var(--text); }
  .resume .btn { flex: none; min-height: 38px; padding: 0 12px; font-size: 13px; }
  .resume .icon-btn { margin: 0; min-width: 38px; min-height: 38px; }

  .rec-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line-soft);
    border-radius: calc(var(--radius) - 2px);
    background: var(--panel-2);
  }
  .rec-row + .rec-row { margin-top: 8px; }
  .rec-row .rec-main { flex: 1; min-width: 0; }
  .rec-row .rec-name { font-size: 13px; font-weight: 600; }
  .rec-row .rec-val { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .rec-row .rec-val.has { color: var(--accent); font-weight: 600; }
  .rec-row .btn { min-height: 40px; padding: 0 12px; font-size: 13px; }

  .stage {
    position: relative;
    width: min(88vw, 420px);
    max-width: 100%;
    margin: 0 auto;
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel-2);
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    text-align: center;
    border-radius: var(--radius);
    background: color-mix(in srgb, var(--bg) 80%, transparent);
    backdrop-filter: blur(3px);
  }
  .overlay p { margin: 0; }
  .ov-title { font-size: 17px; font-weight: 600; }
  .ov-sub { margin-top: 4px; line-height: 1.5; }
  .overlay .btn { margin-top: 14px; min-width: 140px; }

  .actions {
    width: min(88vw, 420px);
    max-width: 100%;
    margin: 14px auto 0;
    display: flex;
    gap: 10px;
  }
  .actions .btn { flex: 1 1 0; }

  .pad {
    width: min(88vw, 420px);
    max-width: 100%;
    margin: 16px auto 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, auto);
    gap: 8px;
    justify-items: stretch;
  }
  .pad button {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: var(--tap);
    min-width: var(--tap);
    padding: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    color: var(--text);
    font-family: inherit;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .pad button:hover { border-color: var(--accent); }
  .pad button:active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 3; }

  .hint { width: min(88vw, 420px); max-width: 100%; margin: 12px auto 0; line-height: 1.5; text-align: center; }
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="index.html" aria-label="返回首页">←</a>
  <h1>贪吃蛇</h1>
  <button class="icon-btn" id="mode" type="button" aria-label="切换明暗">☀</button>
</header>

<main class="wrap">

  <div class="resume hidden" id="resume">
    <span class="small" id="resumeText"></span>
    <button class="btn primary" id="resumeBtn" type="button">继续</button>
    <button class="icon-btn" id="resumeClose" type="button" aria-label="忽略存档提示">✕</button>
  </div>

  <div class="hud">
    <div class="stat"><span class="small muted">分数</span><strong id="score">0</strong></div>
  </div>

  <div id="score-row"></div>

  <div class="stage">
    <canvas id="cv" width="400" height="400" aria-label="贪吃蛇棋盘" role="img"></canvas>
    <div class="overlay" id="overlay">
      <div id="overlayText">
        <p class="ov-title">点开始 / 按方向键开始</p>
        <p class="ov-sub small muted">滑动屏幕或按下方方向键也能玩</p>
      </div>
      <button class="btn primary" id="overlayBtn" type="button">开始</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="pauseBtn" type="button" aria-label="暂停游戏">暂停</button>
    <button class="btn ghost" id="restartBtn" type="button" aria-label="重新开始游戏">重新开始</button>
  </div>

  <div class="pad">
    <button class="up" id="padUp" type="button" aria-label="向上">↑</button>
    <button class="left" id="padLeft" type="button" aria-label="向左">←</button>
    <button class="right" id="padRight" type="button" aria-label="向右">→</button>
    <button class="down" id="padDown" type="button" aria-label="向下">↓</button>
  </div>

  <p class="hint muted small">方向键 / WASD，或滑动屏幕。撞墙或撞到自己就结束；隐藏页面会自动暂停。</p>

</main>

<script>
(function () {
  'use strict';

  /* 最高分键：arcade.snake.best（门禁约定，不能改）。
   * 读走共用运行时 Arcade.getScore —— 页内"删除记录"之后这里立刻读到空；
   * 写仍落在同一把键上（运行时内部也是这个前缀）。
   */
  var BEST_KEY = 'arcade.snake.best';
  var N = 20;
  var START_MS = 140;
  var MIN_MS = 75;

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score');
  var overlayEl = document.getElementById('overlay');
  var overlayTextEl = document.getElementById('overlayText');
  var overlayBtn = document.getElementById('overlayBtn');
  var pauseBtn = document.getElementById('pauseBtn');
  var restartBtn = document.getElementById('restartBtn');

  /* idle | running | paused | over */
  var state = 'idle';
  var snake = [];
  var dir = { x: 1, y: 0 };
  var pending = [];
  var food = { x: 0, y: 0 };
  var score = 0;
  var best = 0;
  var eaten = 0;
  var interval = START_MS;
  var acc = 0;
  var last = 0;
  var rafId = 0;
  var cell = 20;
  var pad = 0;
  var size = 380;      /* CSS 像素下的棋盘边长 */
  var dpr = 1;

  /* ── 最高分：读取全部交给共用运行时（它已包了 try/catch）── */
  function readBest() {
    var value = Arcade.getScore('snake');
    var n = typeof value === 'number' ? value : parseInt(value, 10);
    return isFinite(n) && n > 0 ? n : 0;
  }

  function writeBest(value) {
    try {
      window.localStorage.setItem(BEST_KEY, String(value));
    } catch (err) {
      /* 隐私模式下存储会抛，忽略即可 */
    }
  }

  function syncBest() {
    if (score > best) {
      best = score;
      writeBest(best);
    }
    scoreEl.textContent = String(score);
  }

  /* ── 画布配色跟着主题变量走（亮色下不再是一块死黑底）──────────
   * getComputedStyle 每帧查太贵，所以缓存；切明暗时 refreshColors() 失效重读。
   */
  var colors = { bg: '#101318', line: 'rgba(38, 43, 51, .7)', accent: '#4fd8a4' };

  function cssVar(name, fallback) {
    try {
      var value = window.getComputedStyle(document.documentElement).getPropertyValue(name);
      value = value === null ? '' : String(value).trim();
      return value || fallback;
    } catch (err) {
      return fallback;
    }
  }

  function refreshColors() {
    colors.bg = cssVar('--panel-2', '#101318');
    colors.line = cssVar('--line', 'rgba(38, 43, 51, .7)');
    colors.accent = cssVar('--accent', '#4fd8a4');
  }

  /* ── 画布尺寸：CSS 决定显示大小，这里只同步后备像素 ── */
  function fit() {
    var rect = cv.getBoundingClientRect();
    size = rect.width || 320;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(size * dpr);
    cv.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pad = Math.max(1, Math.round(size * 0.012));
    cell = (size - pad * 2) / N;
    refreshColors();
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, size, size);

    ctx.fillStyle = colors.bg;
    ctx.fillRect(0, 0, size, size);

    /* 网格：很淡，只为看出格子 */
    ctx.globalAlpha = .6;
    ctx.strokeStyle = colors.line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 1; i < N; i++) {
      var p = pad + i * cell;
      ctx.moveTo(p, pad);
      ctx.lineTo(p, size - pad);
      ctx.moveTo(pad, p);
      ctx.lineTo(size - pad, p);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    /* 食物 */
    var fx = pad + food.x * cell + cell / 2;
    var fy = pad + food.y * cell + cell / 2;
    ctx.fillStyle = colors.accent;
    ctx.beginPath();
    ctx.arc(fx, fy, Math.max(2, cell * 0.32), 0, Math.PI * 2);
    ctx.fill();

    /* 蛇：头用不透明，身子稍微透一点，形成两段层次 */
    for (var s = 0; s < snake.length; s++) {
      var seg = snake[s];
      var x = pad + seg.x * cell;
      var y = pad + seg.y * cell;
      var inset = Math.max(1, cell * 0.08);
      var r = Math.max(2, cell * 0.22);
      ctx.fillStyle = colors.accent;
      ctx.globalAlpha = s === 0 ? 1 : 0.72;
      roundRect(x + inset, y + inset, cell - inset * 2, cell - inset * 2, r);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r) {
    var rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.lineTo(x + w - rr, y);
    ctx.arcTo(x + w, y, x + w, y + rr, rr);
    ctx.lineTo(x + w, y + h - rr);
    ctx.arcTo(x + w, y + h, x + w - rr, y + h, rr);
    ctx.lineTo(x + rr, y + h);
    ctx.arcTo(x, y + h, x, y + h - rr, rr);
    ctx.lineTo(x, y + rr);
    ctx.arcTo(x, y, x + rr, y, rr);
    ctx.closePath();
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < N; x++) {
      for (var y = 0; y < N; y++) {
        var taken = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { taken = true; break; }
        }
        if (!taken) free.push({ x: x, y: y });
      }
    }
    if (!free.length) return false;
    food = free[Math.floor(Math.random() * free.length)];
    return true;
  }

  /* 暂停按钮三态：idle/over 时不可点，running 显示「暂停」，paused 显示「继续」 */
  function setPauseButton(mode) {
    if (mode === 'running') {
      pauseBtn.textContent = '暂停';
      pauseBtn.setAttribute('aria-label', '暂停游戏');
      pauseBtn.disabled = false;
    } else if (mode === 'paused') {
      pauseBtn.textContent = '继续';
      pauseBtn.setAttribute('aria-label', '继续游戏');
      pauseBtn.disabled = false;
    } else {
      pauseBtn.textContent = '暂停';
      pauseBtn.setAttribute('aria-label', '暂停游戏');
      pauseBtn.disabled = true;
    }
  }

  function reset() {
    stopLoop();
    state = 'idle';
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    pending = [];
    score = 0;
    eaten = 0;
    interval = START_MS;
    acc = 0;
    placeFood();
    syncBest();
    setPauseButton('idle');
    showOverlay('点开始 / 按方向键开始', '滑动屏幕或按下方方向键也能玩', '开始');
    hideResumeHint();
    draw();
  }

  function showOverlay(title, sub, btnText) {
    overlayTextEl.textContent = '';
    var p1 = document.createElement('p');
    p1.className = 'ov-title';
    p1.textContent = title;
    overlayTextEl.appendChild(p1);
    if (sub) {
      var p2 = document.createElement('p');
      p2.className = 'ov-sub small muted';
      p2.textContent = sub;
      overlayTextEl.appendChild(p2);
    }
    overlayBtn.textContent = btnText;
    overlayEl.classList.remove('hidden');
  }

  function hideOverlay() {
    overlayEl.classList.add('hidden');
  }

  /* ── 主循环：rAF 累加器，暂停/隐藏时彻底停掉 ── */
  function startLoop() {
    stopLoop();
    last = (window.performance && window.performance.now) ? window.performance.now() : Date.now();
    acc = 0;
    rafId = window.requestAnimationFrame(frame);
  }

  function stopLoop() {
    if (rafId) {
      window.cancelAnimationFrame(rafId);
      rafId = 0;
    }
  }

  function frame(now) {
    rafId = 0;
    if (state !== 'running') { draw(); return; }
    acc += now - last;
    last = now;
    /* 长时间挂起后别一次追很多步 */
    if (acc > 1000) acc = interval;
    while (acc >= interval && state === 'running') {
      acc -= interval;
      step();
    }
    draw();
    if (state === 'running') rafId = window.requestAnimationFrame(frame);
  }

  function step() {
    if (pending.length) {
      var d = pending.shift();
      if (!(d.x === -dir.x && d.y === -dir.y)) dir = d;
    }
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) {
      return gameOver('撞到墙了');
    }

    var grows = head.x === food.x && head.y === food.y;
    var limit = grows ? snake.length : snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        return gameOver('撞到自己了');
      }
    }

    snake.unshift(head);
    if (grows) {
      score += 10;
      eaten += 1;
      interval = Math.max(MIN_MS, START_MS - eaten * 4);
      syncBest();
      if (!placeFood()) {
        return gameOver('整个棋盘都填满了');
      }
    } else {
      snake.pop();
    }
  }

  function gameOver(reason) {
    state = 'over';
    stopLoop();
    /* 记录可能刚被人在页内删掉：以存储里的现状为准 */
    best = readBest();
    syncBest();
    setPauseButton('over');
    showOverlay('游戏结束 · ' + reason, '得分 ' + score + ' · 最高分 ' + best, '再来一局');
    draw();
  }

  function start() {
    if (state === 'running') return;
    if (state === 'over' || state === 'idle') {
      /* 从 idle / over 开局：清分重来 */
      if (state === 'over') {
        reset();
      }
      state = 'running';
      hideOverlay();
      hideResumeHint();
      setPauseButton('running');
      startLoop();
      return;
    }
    if (state === 'paused') resume();
  }

  function resume() {
    if (state !== 'paused') return;
    state = 'running';
    hideOverlay();
    setPauseButton('running');
    startLoop();
  }

  function pause() {
    if (state !== 'running') return;
    state = 'paused';
    stopLoop();
    setPauseButton('paused');
    showOverlay('已暂停', '点继续或按空格键回到游戏', '继续');
    draw();
  }

  function togglePause() {
    if (state === 'running') pause();
    else if (state === 'paused') resume();
    else if (state === 'idle' || state === 'over') start();
  }

  /* 方向输入：idle/over 时按方向键直接开局 */
  function input(dx, dy) {
    if (state === 'idle' || state === 'over') {
      start();
      if (state !== 'running') return;
    }
    if (state === 'paused') { resume(); return; }
    if (state !== 'running') return;
    var lastDir = pending.length ? pending[pending.length - 1] : dir;
    if (dx === lastDir.x && dy === lastDir.y) return;
    if (dx === -lastDir.x && dy === -lastDir.y) return;
    if (pending.length < 2) pending.push({ x: dx, y: dy });
  }

  /* ── 键盘 ─────────────────────────────────────────────── */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key;
    if (k === ' ' || k === 'Spacebar') {
      e.preventDefault();
      togglePause();
      return;
    }
    if (k === 'p' || k === 'P') { e.preventDefault(); togglePause(); return; }
    var dx = 0, dy = 0;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') dx = -1;
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') dx = 1;
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') dy = -1;
    else if (k === 'ArrowDown' || k === 's' || k === 'S') dy = 1;
    else return;
    e.preventDefault();
    input(dx, dy);
  }, { passive: false });

  /* ── 触屏：全页滑动，按钮/链接上的触摸不算 ─────────────── */
  var startX = 0, startY = 0, tracking = false;

  function isControl(target) {
    var el = target;
    while (el && el !== document.body) {
      if (el.tagName === 'BUTTON' || el.tagName === 'A') return true;
      el = el.parentNode;
    }
    return false;
  }

  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    if (isControl(e.target)) { tracking = false; return; }
    tracking = true;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchmove', function (e) {
    if (!tracking) return;
    if (e.cancelable) e.preventDefault();
  }, { passive: false });

  document.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    if (!e.changedTouches.length) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - startX;
    var dy = t.clientY - startY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) input(dx > 0 ? 1 : -1, 0);
    else input(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  document.addEventListener('touchcancel', function () {
    tracking = false;
  }, { passive: true });

  /* 屏幕方向键 */
  function bindPad(id, dx, dy) {
    var el = document.getElementById(id);
    el.addEventListener('click', function () { input(dx, dy); });
  }
  bindPad('padUp', 0, -1);
  bindPad('padLeft', -1, 0);
  bindPad('padRight', 1, 0);
  bindPad('padDown', 0, 1);

  pauseBtn.addEventListener('click', togglePause);
  restartBtn.addEventListener('click', function () { reset(); });
  overlayBtn.addEventListener('click', function () {
    if (state === 'paused') resume();
    else start();
  });

  /* ── 主题按钮 / 页内最高分行 ───────────────────────────────
   * #mode 必须在 mountSlots 之前就存在：运行时会把自己的存档按钮
   * 插在它前面，否则顶栏右边会少一个入口。
   */
  var modeBtn = document.getElementById('mode');
  Arcade.mountModeToggle(modeBtn, 'snake');
  modeBtn.addEventListener('click', function () {
    /* 明暗刚被切过（运行时的监听先跑），重读主题变量再画一帧 */
    refreshColors();
    draw();
  });

  /* 最高分统一由这一行显示；页面不再自己画一份，避免"删了记录还显示旧分" */
  Arcade.mountScoreRow(document.getElementById('score-row'), 'snake');

  /* ── 从存档恢复：蛇身 / 方向 / 食物 / 分数 / 速度整体搬回内存，
   *    然后停在暂停态并显示"继续"按钮。
   */
  function restoreGame(data) {
    /* 返回布尔：true = 已应用，false = 坏档被拒绝（当前局面不动）。 */
    if (!data || !Array.isArray(data.snake) || data.snake.length === 0) return false;
    var body = [];
    var i, seg, sx, sy;
    for (i = 0; i < data.snake.length; i++) {
      seg = data.snake[i];
      if (!seg) continue;
      sx = parseInt(seg.x, 10);
      sy = parseInt(seg.y, 10);
      if (!isFinite(sx) || !isFinite(sy)) continue;
      if (sx < 0 || sy < 0 || sx >= N || sy >= N) continue;
      body.push({ x: sx, y: sy });
    }
    if (!body.length) return false;

    snake = body;
    dir = normalDir(data.dir);
    pending = [];
    score = typeof data.score === 'number' && isFinite(data.score) ? Math.max(0, Math.floor(data.score)) : 0;
    eaten = typeof data.eaten === 'number' && isFinite(data.eaten) ? Math.max(0, Math.floor(data.eaten)) : 0;
    interval = clampInterval(data.interval, eaten);

    var fx = parseInt(data.food && data.food.x, 10);
    var fy = parseInt(data.food && data.food.y, 10);
    if (isFinite(fx) && isFinite(fy) && fx >= 0 && fy >= 0 && fx < N && fy < N) {
      food = { x: fx, y: fy };
    } else {
      placeFood();
    }

    acc = 0;
    stopLoop();
    state = 'paused';
    best = readBest();
    syncBest();
    setPauseButton('paused');
    showOverlay('已载入存档', '点继续接着玩 · 分数 ' + score + ' · 长度 ' + snake.length, '继续');
    draw();
    hideResumeHint();
    return true;
  }

  /** 存档里的方向只认四个单位向量，坏值回落到向右。 */
  function normalDir(d) {
    if (d) {
      if (d.x === -1 && d.y === 0) return { x: -1, y: 0 };
      if (d.x === 1 && d.y === 0) return { x: 1, y: 0 };
      if (d.x === 0 && d.y === -1) return { x: 0, y: -1 };
      if (d.x === 0 && d.y === 1) return { x: 0, y: 1 };
    }
    return { x: 1, y: 0 };
  }

  /** 间隔必须落在 [MIN_MS, START_MS]，坏值按吃了几个重新算。 */
  function clampInterval(value, eatenCount) {
    var n = typeof value === 'number' ? value : parseFloat(value);
    if (!isFinite(n) || n <= 0) n = START_MS - eatenCount * 4;
    return Math.max(MIN_MS, Math.min(START_MS, n));
  }

  /* ── 存档槽（最多 5 个，满 5 个由运行时淘汰分数最低的）──────
   * state 全部是可 JSON 化的纯数据：蛇身坐标、方向、食物、分数、间隔。
   */
  var slots = Arcade.mountSlots({
    gameId: 'snake',
    unit: '分',
    capture: function () {
      if (state === 'idle' || state === 'over') return null;  /* 还没开始 / 已经结束 */
      if (!snake.length) return null;
      var body = [];
      for (var i = 0; i < snake.length; i++) body.push({ x: snake[i].x, y: snake[i].y });
      var queued = [];
      for (var j = 0; j < pending.length; j++) queued.push({ x: pending[j].x, y: pending[j].y });
      return {
        score: score,
        label: score + ' 分 · 长度 ' + snake.length,
        state: {
          v: 1,
          snake: body,
          dir: { x: dir.x, y: dir.y },
          pending: queued,
          food: { x: food.x, y: food.y },
          score: score,
          eaten: eaten,
          interval: interval,
          best: best
        }
      };
    },
    restore: restoreGame,
    onPause: function () {
      if (state === 'running') pause();
      /* 无论什么状态都别让 rAF 在后台空转 */
      stopLoop();
    }
  });

  /* ── "有上次进度"提示条：存在 auto 槽才出现，没有就安静 ──── */
  var resumeEl = document.getElementById('resume');
  var resumeTextEl = document.getElementById('resumeText');
  var resumeBtn = document.getElementById('resumeBtn');

  function hideResumeHint() {
    resumeEl.classList.add('hidden');
  }

  function showResumeHint() {
    var entry = Arcade.loadSlot('snake', 'auto');
    if (entry === null) return;
    var when = Arcade.timeAgo(entry.at);
    resumeTextEl.textContent = '有上次的进度（' + entry.score + ' 分' + (when ? ' · ' + when : '') + '），点继续或右上 ⛁ 也能载入';
    resumeEl.classList.remove('hidden');
  }

  resumeBtn.addEventListener('click', function () {
    var entry = Arcade.loadSlot('snake', 'auto');
    if (entry === null) { hideResumeHint(); return; }
    restoreGame(entry.state);
  });

  document.getElementById('resumeClose').addEventListener('click', hideResumeHint);

  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);

  best = readBest();
  fit();
  reset();
  showResumeHint();
})();
</script>

</body>
</html>
