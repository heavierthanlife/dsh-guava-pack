<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d10">
<title>扫雷 · 休闲角</title>
<link rel="stylesheet" href="shared.css">
<!-- 共用运行时：主题/明暗/分数/存档都从这里来；必须在首帧前落到 <html> 上 -->
<script src="arcade.js"></script>
<script>Arcade.initTheme({ page: 'mines', accent: 'rose' });</script>
<style>
  .wrap { padding: 14px 16px 30px; }

  /* 棋盘的"面"和"缝"跟着明暗走：亮色模式下留一块黑棋盘会很刺眼。
     这里只动中性色；数字 1-8 的彩色是玩法信息，放到后面单独给亮色加深版。 */
  :root {
    --cell-line: #2c3440;
    --cell-face-a: #1e242d;
    --cell-face-b: #181d25;
    --cell-press: #29323e;
    --cell-open-line: #20262e;
  }
  html[data-mode="light"] {
    --cell-line: #b9c4d2;
    --cell-face-a: #e9eff6;
    --cell-face-b: #dde5ef;
    --cell-press: #cfd9e6;
    --cell-open-line: #c6d0dd;
  }

  /* 顶部"上次没玩完"提示：存在存档才出现，一条就够，不用弹窗 */
  .resume {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 8px 12px;
    border: 1px solid var(--accent);
    border-radius: var(--radius);
    background: var(--accent-soft);
    font-size: 13px;
  }
  .resume[hidden] { display: none; }
  .resume .resume-msg { flex: 1 1 150px; min-width: 0; line-height: 1.5; }
  .resume .btn { padding: 0 12px; font-size: 13px; }

  /* mountScoreRow 生成 .rec-row；shared.css 只给了 .slot，这里补上记录行 */
  #score-row { margin-bottom: 10px; }
  .rec-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border: 1px solid var(--line-soft);
    border-radius: calc(var(--radius) - 2px);
    background: var(--panel);
  }
  .rec-row + .rec-row { margin-top: 8px; }
  .rec-row .rec-main { flex: 1; min-width: 0; }
  .rec-row .rec-name { font-size: 11px; letter-spacing: .04em; color: var(--muted); }
  .rec-row .rec-val {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-top: 2px;
    line-height: 1.45;
  }
  .rec-row .rec-val.has { color: var(--accent); }
  .rec-row .btn { padding: 0 12px; font-size: 13px; }

  .seg { display: flex; gap: 8px; margin-bottom: 12px; }
  .seg .btn { flex: 1 1 0; min-width: 0; padding: 0 6px; font-size: 13px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  .bar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
  .stat {
    min-width: 0;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
  }
  .stat .k { display: block; font-size: 11px; letter-spacing: .04em; color: var(--muted); }
  .stat .v {
    display: block;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.3;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .actions { margin-bottom: 8px; }
  .actions .btn { flex: 1 1 0; min-width: 0; padding: 0 10px; font-size: 13px; }
  .actions .btn.primary { font-weight: 600; }

  .hint { margin: 2px 0 10px; line-height: 1.55; }

  /* 棋盘：页面不横滚，只有这一层可以左右滑（高级 30 列在手机上偏宽） */
  .board-wrap {
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    padding: 2px 0 8px;
  }

  #board {
    display: grid;
    grid-template-columns: repeat(var(--cols, 9), var(--cell, 32px));
    gap: var(--gap, 2px);
    width: max-content;
    margin: 0 auto;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .cell {
    width: var(--cell, 32px);
    height: var(--cell, 32px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 1px solid var(--cell-line);
    border-radius: 4px;
    background: linear-gradient(180deg, var(--cell-face-a), var(--cell-face-b));
    color: var(--text);
    font: 600 14px/1 system-ui, -apple-system, "Segoe UI", "Noto Sans SC", sans-serif;
    font-size: calc(var(--cell, 32px) * .56);
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    transition: background .08s ease, transform .08s ease, border-color .08s ease;
  }
  .cell:active, .cell.down { background: var(--cell-press); transform: scale(.95); }
  .cell:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; position: relative; z-index: 1; }

  .cell.open {
    background: var(--panel-2);
    border-color: var(--cell-open-line);
    transform: none;
    font-weight: 700;
  }
  /* 亮色下翻开的格子要更"平"一点，和凸起的未翻开格子拉开层次 */
  html[data-mode="light"] .cell.open { background: #f8fafd; }
  .cell.flag { color: var(--warn); }
  .cell.mine { color: var(--bad); }
  .cell.boom {
    background: color-mix(in srgb, var(--bad) 22%, transparent);
    border-color: var(--bad);
    color: var(--text);
  }
  .cell.wrong { color: var(--bad); }

  .cell.n1 { color: #6fb6ff; }
  .cell.n2 { color: #7ee0a8; }
  .cell.n3 { color: #ff8b8b; }
  .cell.n4 { color: #b79cff; }
  .cell.n5 { color: #f5c451; }
  .cell.n6 { color: #4fd1c5; }
  .cell.n7 { color: #e8edf4; }
  .cell.n8 { color: #9aa6b2; }

  /* 数字 1-8 的彩色是玩法信息（扫一眼就知道几颗雷），所以不接 --accent。
     亮色模式下只压深明度保住对比度，色相与"数字→颜色"的对应关系不变。 */
  html[data-mode="light"] .cell.n1 { color: #1258a8; }
  html[data-mode="light"] .cell.n2 { color: #0b7a52; }
  html[data-mode="light"] .cell.n3 { color: #c8323f; }
  html[data-mode="light"] .cell.n4 { color: #5b32c4; }
  html[data-mode="light"] .cell.n5 { color: #8a5a00; }
  html[data-mode="light"] .cell.n6 { color: #0a7378; }
  html[data-mode="light"] .cell.n7 { color: #16202e; }
  html[data-mode="light"] .cell.n8 { color: #52606f; }

  .cell.pulse { animation: cellPulse .34s ease; }
  @keyframes cellPulse {
    0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 80%, transparent); }
    100% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 0%, transparent); }
  }

  .banner { display: none; }
  .banner.show {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    font-size: 13px;
  }
  .banner.win { border-color: color-mix(in srgb, var(--ok) 55%, transparent); }
  .banner.lose { border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
  .banner.paused { border-color: var(--accent); background: var(--accent-soft); }
  .banner .msg { flex: 1 1 160px; line-height: 1.5; }

  @media (max-width: 360px) {
    .seg .btn { font-size: 12px; }
    .stat .v { font-size: 15px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="index.html" aria-label="返回首页">←</a>
  <h1>扫雷</h1>
  <!-- mountSlots 会把存档按钮插在这个 #mode 前面，所以 id 必须是 mode -->
  <button class="icon-btn" id="mode" type="button" aria-label="切换明暗">☀</button>
</header>

<div class="wrap">

  <!-- 有存档才显示（见 paintResumeHint）；没有存档时保持安静，不弹窗 -->
  <div class="resume" id="resumeHint" hidden></div>

  <div class="seg" role="group" aria-label="难度">
    <button type="button" class="btn primary" data-level="easy" aria-pressed="true">初级 9×9</button>
    <button type="button" class="btn" data-level="medium" aria-pressed="false">中级 16×16</button>
    <button type="button" class="btn" data-level="hard" aria-pressed="false">高级 30×16</button>
  </div>

  <div class="bar">
    <div class="stat"><span class="k">剩余雷</span><span class="v" id="minesLeft">10</span></div>
    <div class="stat"><span class="k">用时（秒）</span><span class="v" id="time">0.0</span></div>
    <div class="stat"><span class="k">最佳（秒）</span><span class="v" id="best">--</span></div>
  </div>

  <!-- 三档最高分 + 就地删除（mountScoreRow 渲染） -->
  <div id="score-row"></div>

  <div class="row actions">
    <button type="button" class="btn" id="restart">重开</button>
    <button type="button" class="btn ghost" id="flagMode" aria-pressed="false">🚩 插旗模式</button>
  </div>

  <p class="hint small muted" id="hint">轻点翻开 · 长按 0.4 秒或右键插旗</p>

  <div class="board-wrap" id="boardWrap">
    <div id="board" role="grid" aria-label="扫雷棋盘"></div>
  </div>

  <div class="banner" id="banner" role="status" aria-live="polite"></div>

</div>

<script>
(function () {
  'use strict';

  var LONG_PRESS_MS = 400;
  var LEVELS = {
    easy:   { rows: 9,  cols: 9,  mines: 10, label: '初级' },
    medium: { rows: 16, cols: 16, mines: 40, label: '中级' },
    hard:   { rows: 16, cols: 30, mines: 99, label: '高级' }
  };
  var LEVEL_KEYS = ['easy', 'medium', 'hard'];

  var elBoard = document.getElementById('board');
  var elWrap = document.getElementById('boardWrap');
  var elMines = document.getElementById('minesLeft');
  var elTime = document.getElementById('time');
  var elBest = document.getElementById('best');
  var elHint = document.getElementById('hint');
  var elBanner = document.getElementById('banner');
  var elRestart = document.getElementById('restart');
  var elFlagMode = document.getElementById('flagMode');
  var elMode = document.getElementById('mode');
  var elScoreRow = document.getElementById('score-row');
  var elResume = document.getElementById('resumeHint');

  var S = {
    rows: 9, cols: 9, total: 81, mineCount: 10,
    mines: null, adj: null, state: null,
    started: false, over: false, won: false, paused: false,
    opened: 0, flags: 0,
    flagMode: false, boom: -1
  };

  var level = 'easy';
  var cells = [];
  var focusIdx = 0;
  var best = {};
  var scoreRow = null;
  var slotStore = null;

  var press = null;
  var suppressCtxUntil = 0;
  var timerId = null;
  var timerRunning = false;
  var tStart = 0;
  var elapsedAcc = 0;

  /* ── 最高分 ───────────────────────────────────────────────
   * 读写全部走 Arcade（键 arcade.mines.best，结构 {easy,medium,hard}），
   * localStorage 不再由本页直接访问 —— 少一处非 try 的机会。
   * 值的历史口径是**毫秒**（本页 fmtMs 除以 1000 显示）；早期版本可能按
   * "秒"写过，normalizeBest 统一折成毫秒，比较才不会错一个数量级。
   * 每次显示都重新从存储读：页内删掉记录后 HUD 不会还挂着一份旧值。
   */
  var bestMemory = {};   // 存储写不进去时（隐私模式）本会话仍能看到成绩

  function normalizeBest(v) {
    var n = typeof v === 'number' ? v : Number(v);
    if (!isFinite(n) || n <= 0) return 0;
    /* 毫秒记录必然 >= 1000；更小的数只可能来自"秒"口径的旧记录 */
    return n < 1000 ? n * 1000 : n;
  }

  function syncBest() {
    var out = {};
    var data = Arcade.getScore('mines');
    if (typeof data === 'number') {
      /* 更早版本存过单个数值：当作每一档的历史最佳 */
      var all = normalizeBest(data);
      if (all > 0) {
        for (var j = 0; j < LEVEL_KEYS.length; j++) out[LEVEL_KEYS[j]] = all;
      }
    } else if (data && typeof data === 'object') {
      for (var i = 0; i < LEVEL_KEYS.length; i++) {
        var k = LEVEL_KEYS[i];
        var ms = normalizeBest(data[k]);
        if (ms > 0) out[k] = ms;
      }
    }
    /* 写失败时的兜底：只补存储里没有的档，不会把已删除的记录"复活" */
    for (var m = 0; m < LEVEL_KEYS.length; m++) {
      var key = LEVEL_KEYS[m];
      if (!out[key] && bestMemory[key]) out[key] = bestMemory[key];
    }
    best = out;
    return out;
  }

  function saveBest() {
    if (!Arcade.writeJSON('mines.best', best)) {
      /* 存储不可用：本会话先记在内存里，刷新即丢（与 Arcade 的降级策略一致） */
      bestMemory = {};
      for (var i = 0; i < LEVEL_KEYS.length; i++) {
        if (best[LEVEL_KEYS[i]]) bestMemory[LEVEL_KEYS[i]] = best[LEVEL_KEYS[i]];
      }
    } else {
      bestMemory = {};
    }
  }

  /* ── 计时 ─────────────────────────────────────────────── */
  function fmtMs(ms) {
    if (!isFinite(ms) || ms < 0) ms = 0;
    return (ms / 1000).toFixed(1);
  }

  function elapsedMs() {
    return elapsedAcc + (timerRunning ? (Date.now() - tStart) : 0);
  }

  function paintClock() {
    if (elTime) elTime.textContent = fmtMs(elapsedMs());
  }

  function startTimer() {
    if (timerRunning || S.over || S.won || S.paused) return;
    timerRunning = true;
    tStart = Date.now();
    if (timerId === null) {
      timerId = setInterval(paintClock, 100);
    }
  }

  function stopTimer() {
    if (!timerRunning) return;
    elapsedAcc += Date.now() - tStart;
    timerRunning = false;
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
  }

  function resetTimer() {
    stopTimer();
    elapsedAcc = 0;
    paintClock();
  }

  /* ── 存档展示 ─────────────────────────────────────────── */
  function paintBest() {
    var b = syncBest()[level];
    elBest.textContent = b ? fmtMs(b) : '--';
  }

  function paintHud() {
    elMines.textContent = String(S.mineCount - S.flags);
    paintBest();
    paintClock();
  }

  /* ── 棋盘尺寸 ─────────────────────────────────────────── */
  function layout() {
    var avail = elWrap ? elWrap.clientWidth : 320;
    if (!avail || avail < 80) avail = Math.max(240, window.innerWidth - 32);
    var gap = S.cols > 20 ? 1 : 2;
    elBoard.style.setProperty('--gap', gap + 'px');
    elBoard.style.setProperty('--cols', String(S.cols));
    var fit = Math.floor((avail - gap * (S.cols - 1)) / S.cols);
    /* 小屏也不小于 18px，否则点不准；高级超宽时交给容器横向滚动 */
    var size = Math.max(18, Math.min(40, fit));
    elBoard.style.setProperty('--cell', size + 'px');
  }

  /* ── 新局 ─────────────────────────────────────────────── */
  function newGame(nextLevel) {
    if (nextLevel && LEVELS[nextLevel]) level = nextLevel;
    var cfg = LEVELS[level];

    S.rows = cfg.rows;
    S.cols = cfg.cols;
    S.total = cfg.rows * cfg.cols;
    S.mineCount = cfg.mines;
    S.mines = new Uint8Array(S.total);
    S.adj = new Uint8Array(S.total);
    S.state = new Uint8Array(S.total);
    S.started = false;
    S.over = false;
    S.won = false;
    S.paused = false;
    S.opened = 0;
    S.flags = 0;
    S.boom = -1;

    focusIdx = 0;
    cancelPress();
    resetTimer();
    hideBanner();
    buildCells();
    layout();
    render(true);
    paintHud();
    paintLevels();
    paintHint();
  }

  function buildCells() {
    elBoard.textContent = '';
    elBoard.setAttribute('aria-rowcount', String(S.rows));
    elBoard.setAttribute('aria-colcount', String(S.cols));
    cells = new Array(S.total);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < S.total; i++) {
      var d = document.createElement('div');
      d.className = 'cell';
      d.setAttribute('role', 'gridcell');
      d.setAttribute('data-i', String(i));
      d.tabIndex = i === 0 ? 0 : -1;
      cells[i] = d;
      frag.appendChild(d);
    }
    elBoard.appendChild(frag);
  }

  /* ── 布雷 / 展开 ──────────────────────────────────────── */
  function placeMines(safe) {
    var banned = {};
    banned[safe] = true;
    var sr = (safe / S.cols) | 0;
    var sc = safe % S.cols;
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        var r = sr + dr;
        var c = sc + dc;
        if (r >= 0 && c >= 0 && r < S.rows && c < S.cols) banned[r * S.cols + c] = true;
      }
    }

    var pool = [];
    for (var i = 0; i < S.total; i++) {
      if (!banned[i]) pool.push(i);
    }
    /* 密度极高时退化为“只保证首点不是雷” */
    if (pool.length < S.mineCount) {
      pool = [];
      for (var j = 0; j < S.total; j++) {
        if (j !== safe) pool.push(j);
      }
    }

    for (var k = 0; k < S.mineCount; k++) {
      var pick = k + Math.floor(Math.random() * (pool.length - k));
      var tmp = pool[k];
      pool[k] = pool[pick];
      pool[pick] = tmp;
      S.mines[pool[k]] = 1;
    }

    computeAdj();
  }

  /** 由雷区重算每格的邻雷数。恢复存档时也走这里，不信存档里的冗余数字。 */
  function computeAdj() {
    for (var p = 0; p < S.total; p++) {
      if (S.mines[p]) {
        S.adj[p] = 0;
        continue;
      }
      var pr = (p / S.cols) | 0;
      var pc = p % S.cols;
      var n = 0;
      for (var ar = -1; ar <= 1; ar++) {
        for (var ac = -1; ac <= 1; ac++) {
          if (!ar && !ac) continue;
          var rr = pr + ar;
          var cc = pc + ac;
          if (rr < 0 || cc < 0 || rr >= S.rows || cc >= S.cols) continue;
          if (S.mines[rr * S.cols + cc]) n++;
        }
      }
      S.adj[p] = n;
    }
  }

  function openZone(start) {
    var stack = [start];
    while (stack.length) {
      var cur = stack.pop();
      var cr = (cur / S.cols) | 0;
      var cc = cur % S.cols;
      for (var dr = -1; dr <= 1; dr++) {
        for (var dc = -1; dc <= 1; dc++) {
          if (!dr && !dc) continue;
          var r = cr + dr;
          var c = cc + dc;
          if (r < 0 || c < 0 || r >= S.rows || c >= S.cols) continue;
          var n = r * S.cols + c;
          if (S.state[n] !== 0 || S.mines[n]) continue;
          S.state[n] = 1;
          S.opened++;
          if (S.adj[n] === 0) stack.push(n);
        }
      }
    }
  }

  function revealCell(i) {
    if (S.over || S.won || S.paused) return;
    if (S.state[i] !== 0) return;

    if (!S.started) {
      S.started = true;
      placeMines(i);
      startTimer();
    }

    if (S.mines[i]) {
      lose(i);
      return;
    }

    S.state[i] = 1;
    S.opened++;
    if (S.adj[i] === 0) openZone(i);

    render();
    paintHud();
    checkWin();
  }

  function flagCell(i) {
    if (S.over || S.won || S.paused) return;
    if (S.state[i] === 1) return;

    if (S.state[i] === 2) {
      S.state[i] = 0;
      S.flags--;
    } else {
      if (S.flags >= S.mineCount) return;
      S.state[i] = 2;
      S.flags++;
    }

    render();
    paintHud();
  }

  function checkWin() {
    if (S.over || S.won) return;
    if (S.opened === S.total - S.mineCount) win();
  }

  function win() {
    S.won = true;
    S.over = true;
    stopTimer();

    /* 先把插错的旗撤掉，再把剩下的雷补齐，旗数才和雷数对得上 */
    for (var i = 0; i < S.total; i++) {
      if (S.state[i] === 2 && !S.mines[i]) S.state[i] = 0;
    }
    S.flags = 0;
    for (var k = 0; k < S.total; k++) {
      if (S.mines[k] && S.state[k] === 0) S.state[k] = 2;
      if (S.state[k] === 2) S.flags++;
    }

    var ms = elapsedMs();
    var record = false;
    syncBest();   /* 页内可能刚删过记录：比较前先按存储里的现状来 */
    if (!best[level] || ms < best[level]) {
      best[level] = ms;
      saveBest();
      record = true;
    }

    render(true);
    paintHud();
    if (scoreRow) scoreRow.refresh();
    var msg = '🎉 全部扫清 · 用时 ' + fmtMs(ms) + ' 秒' + (record ? ' · 新纪录！' : '');
    showBanner('win', msg);
  }

  function lose(hit) {
    S.over = true;
    S.won = false;
    S.boom = hit;
    S.state[hit] = 1;
    S.opened++;
    stopTimer();
    render(true);
    paintHud();
    showBanner('lose', '💣 踩到雷了 · 用时 ' + fmtMs(elapsedMs()) + ' 秒');
  }

  /* ── 渲染 ─────────────────────────────────────────────── */
  function paintCell(i, force) {
    var d = cells[i];
    if (!d) return;
    var st = S.state[i];
    var cls = 'cell';
    var text = '';
    var what = '未翻开';
    var row = ((i / S.cols) | 0) + 1;
    var col = (i % S.cols) + 1;

    if (st === 1) {
      cls += ' open';
      if (S.mines[i]) {
        cls += ' mine';
        text = '✹';
        what = '地雷';
      } else if (S.adj[i] > 0) {
        cls += ' n' + S.adj[i];
        text = String(S.adj[i]);
        what = S.adj[i] + ' 个相邻雷';
      } else {
        what = '空白';
      }
    } else if (st === 2) {
      cls += ' flag';
      text = '⚑';
      what = '已插旗';
      if (S.over && !S.mines[i]) {
        cls += ' wrong';
        what = '插错的旗';
      }
    } else if (S.over && S.mines[i]) {
      cls += ' mine';
      text = '✹';
      what = '地雷';
    }

    if (i === S.boom) cls += ' boom';

    var sig = cls + '|' + text + '|' + what;
    if (!force && d.__sig === sig) return;
    d.__sig = sig;
    d.className = cls;
    d.textContent = text;
    d.setAttribute('aria-label', '第' + row + '行第' + col + '列，' + what);
  }

  function render(force) {
    for (var i = 0; i < S.total; i++) paintCell(i, force);
  }

  function focusCell(i) {
    if (!cells[i]) return;
    if (cells[focusIdx] && cells[focusIdx] !== cells[i]) cells[focusIdx].tabIndex = -1;
    focusIdx = i;
    cells[i].tabIndex = 0;
    try {
      cells[i].focus();
    } catch (err) {
      /* 某些环境 focus 不可用，忽略 */
    }
  }

  /* ── 提示 / 按钮状态 ──────────────────────────────────── */
  function paintHint() {
    if (S.flagMode) {
      elHint.textContent = '插旗模式：轻点插旗 · 再点取消 · 长按翻开';
    } else if (level === 'hard') {
      elHint.textContent = '轻点翻开 · 长按 0.4 秒或右键插旗 · 棋盘偏宽可左右滑动';
    } else {
      elHint.textContent = '轻点翻开 · 长按 0.4 秒或右键插旗';
    }
  }

  function paintLevels() {
    var btns = document.querySelectorAll('[data-level]');
    for (var i = 0; i < btns.length; i++) {
      var on = btns[i].getAttribute('data-level') === level;
      btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
      if (on) btns[i].classList.add('primary');
      else btns[i].classList.remove('primary');
    }
  }

  /**
   * 底部状态条：胜利 / 踩雷 / 暂停共用同一个壳。
   *
   * @param {string} kind win | lose | paused
   * @param {string} text
   * @param {Array} [actions] [{label, primary, onClick}]；默认是"再来一局"
   */
  function showBanner(kind, text, actions) {
    elBanner.textContent = '';
    elBanner.className = 'banner show ' + kind;
    var msg = document.createElement('span');
    msg.className = 'msg';
    msg.textContent = text;
    elBanner.appendChild(msg);

    var list = actions && actions.length ? actions : [
      { label: '再来一局', primary: true, onClick: function () { newGame(); } }
    ];
    for (var i = 0; i < list.length; i++) {
      (function (spec) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'btn' + (spec.primary ? ' primary' : '');
        b.textContent = spec.label;
        b.addEventListener('click', spec.onClick);
        elBanner.appendChild(b);
      })(list[i]);
    }
  }

  function hideBanner() {
    elBanner.className = 'banner';
    elBanner.textContent = '';
  }

  /* ── 暂停 / 继续 ────────────────────────────────────────
   * 读档后必须停在这里：计时不走，等用户主动点"继续"。
   * 这样"打开一个旧档"不会白送几秒，也不会一恢复就被手滑打开格子。
   */
  function pauseGame(text) {
    if (S.over || S.won) return;
    S.paused = true;
    cancelPress();
    stopTimer();
    paintClock();
    showBanner(
      'paused',
      text || ('已暂停 · 计时停在 ' + fmtMs(elapsedMs()) + ' 秒'),
      [
        { label: '继续', primary: true, onClick: resumeGame },
        { label: '重开', onClick: function () { newGame(); } }
      ]
    );
  }

  function resumeGame() {
    if (!S.paused) return;
    S.paused = false;
    hideBanner();
    paintClock();
    if (S.started && !S.over && !S.won) startTimer();
  }

  /* ── 存档槽：capture / restore / onPause ─────────────────
   * mountSlots 负责面板、自动存档、淘汰；这里只回答三件事：
   *   当前局面是什么（capture）、怎么把局面放回去（restore）、离开时怎么停（onPause）。
   */

  /** 当前局面 → 可 JSON 序列化的快照；null = 现在没东西可存。 */
  function capture() {
    /* 还没下第一手，或者已经分出胜负：没有"继续"的意义，别占存档位 */
    if (!S.started || S.over || S.won) return null;

    var ms = Math.round(elapsedMs());
    var sec = Math.round(ms / 1000);

    var mineList = [];
    for (var i = 0; i < S.total; i++) {
      if (S.mines[i]) mineList.push(i);
    }
    var cellsStr = '';
    for (var k = 0; k < S.total; k++) cellsStr += String(S.state[k]);

    return {
      /* 淘汰依据是"分数最低"。扫雷用时越短越好，所以 score 传**负的秒数**：
       * 20 秒的局 = -20，90 秒的局 = -90。这样"分最低"恰好等于"磨得最久"，
       * 槽位满了会先淘汰那局最没进展的，留下的都是还值得继续的。 */
      score: -(ms / 1000),
      label: LEVELS[level].label + ' · ' + sec + 's',
      state: {
        v: 1,
        level: level,
        rows: S.rows,
        cols: S.cols,
        mineCount: S.mineCount,
        /* 雷只存下标（最多 99 个）；邻雷数恢复时由 computeAdj 重算，不存冗余 */
        mines: mineList,
        /* 0 未翻开 / 1 已翻开 / 2 插旗，行优先拼成字符串，省体积也好校验 */
        cells: cellsStr,
        opened: S.opened,
        flags: S.flags,
        elapsedMs: ms,
        flagMode: S.flagMode === true
      }
    };
  }

  /**
   * 把 state 应用回游戏。恢复后处于**暂停**态（计时不走），等用户点"继续"。
   * 先整体校验再落盘：坏档直接返回 false，不动当前局面。
   *
   * @returns {boolean} 是否恢复成功
   */
  function restore(state) {
    if (!state || typeof state !== 'object') return false;

    var lv = state.level;
    if (typeof lv !== 'string' || !LEVELS[lv]) return false;
    var cfg = LEVELS[lv];
    if (state.rows !== cfg.rows || state.cols !== cfg.cols) return false;

    var total = cfg.rows * cfg.cols;
    var cellsStr = typeof state.cells === 'string' ? state.cells : '';
    if (cellsStr.length !== total) return false;

    var mineList = state.mines;
    if (!Array.isArray(mineList) || mineList.length !== cfg.mines) return false;

    var mines = new Uint8Array(total);
    for (var i = 0; i < mineList.length; i++) {
      var idx = mineList[i];
      if (typeof idx !== 'number' || idx !== Math.floor(idx) || idx < 0 || idx >= total) return false;
      if (mines[idx]) return false;      // 同一个格子两条雷 = 坏档
      mines[idx] = 1;
    }

    var stArr = new Uint8Array(total);
    var opened = 0;
    var flags = 0;
    for (var k = 0; k < total; k++) {
      var ch = cellsStr.charAt(k);
      if (ch === '1') {
        /* 踩到雷就结束的局不会入档；已翻开的格子是雷 ⇒ 数据被改坏了 */
        if (mines[k]) return false;
        stArr[k] = 1;
        opened++;
      } else if (ch === '2') {
        stArr[k] = 2;
        flags++;
      } else if (ch !== '0') {
        return false;
      }
    }
    if (opened === 0) return false;                         // 没翻过任何格 = 没下过第一手
    if (opened >= total - cfg.mines) return false;           // 已经赢了的局不该在存档里

    /* 校验通过，开始落地。雷区直接用存档里的位置：
     * 首点不是雷的规则在当初布雷时已经满足，恢复不能重新布雷，否则局面就变了。 */
    stopTimer();                     // 先停表，再把时间重置为存档里的值
    level = lv;
    S.rows = cfg.rows;
    S.cols = cfg.cols;
    S.total = total;
    S.mineCount = cfg.mines;
    S.mines = mines;
    S.adj = new Uint8Array(total);
    S.state = stArr;
    computeAdj();
    S.started = true;
    S.over = false;
    S.won = false;
    S.paused = true;
    S.opened = opened;
    S.flags = flags;
    S.boom = -1;
    S.flagMode = state.flagMode === true;

    var ms = Number(state.elapsedMs);
    elapsedAcc = isFinite(ms) && ms > 0 ? ms : 0;

    focusIdx = 0;
    cancelPress();
    buildCells();
    layout();
    render(true);
    paintHud();
    paintLevels();
    paintHint();
    elFlagMode.setAttribute('aria-pressed', S.flagMode ? 'true' : 'false');
    if (S.flagMode) elFlagMode.classList.add('primary');
    else elFlagMode.classList.remove('primary');

    if (elResume) elResume.hidden = true;
    pauseGame('已载入存档 · 计时停在 ' + fmtMs(elapsedAcc) + ' 秒');
    return true;
  }

  /**
   * 页面隐藏 / 卸载时由 Arcade.mountSlots 调用：真的停表。
   * 这里不置 S.paused —— 切回标签页沿用原来的"自动接着计时"，不用多点一次。
   */
  function onPause() {
    cancelPress();
    stopTimer();
    paintClock();
  }

  /* ── 顶部"继续上次"提示 ──────────────────────────────────
   * 只在真的有存档时出现，一条横条、不弹窗、不挡操作；"忽略"只藏这一次。
   * 没有存档就完全安静（elResume.hidden = true）。
   */
  function latestSlot() {
    var list = Arcade.listSlots('mines');
    if (!list.length) return null;
    var pick = list[0];
    for (var i = 1; i < list.length; i++) {
      if ((list[i].at || 0) > (pick.at || 0)) pick = list[i];
    }
    return pick;
  }

  function paintResumeHint() {
    if (!elResume) return;
    elResume.textContent = '';
    var entry = latestSlot();
    if (!entry) {
      elResume.hidden = true;
      return;
    }

    var when = Arcade.timeAgo(entry.at);
    var msg = document.createElement('span');
    msg.className = 'resume-msg';
    msg.textContent = '还有一局没玩完：' + (entry.label || '存档') + (when ? ' · ' + when : '');

    var go = document.createElement('button');
    go.type = 'button';
    go.className = 'btn primary';
    go.textContent = '继续';
    go.addEventListener('click', function () {
      if (restore(entry.state)) return;          // restore 会隐藏提示并进入暂停态
      elResume.hidden = true;
      showBanner('lose', '这条存档读不出来，已跳过');
    });

    var skip = document.createElement('button');
    skip.type = 'button';
    skip.className = 'btn ghost';
    skip.textContent = '忽略';
    skip.addEventListener('click', function () { elResume.hidden = true; });

    elResume.appendChild(msg);
    elResume.appendChild(go);
    elResume.appendChild(skip);
    elResume.hidden = false;
  }

  /* 页内删掉最高分后 HUD 要立刻跟着变。confirmAction 在按钮上
   * stopPropagation，所以监听走捕获阶段，并用 setTimeout 把刷新放到
   * "删除已经写进存储"之后（第二次点击才是真删）。 */
  function wireScoreRow() {
    if (!elScoreRow) return;
    elScoreRow.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.btn.danger') : null;
      if (!btn) return;
      if (btn.classList.contains('armed')) bestMemory = {};   // 隐私模式下的内存兜底也清掉
      setTimeout(function () { paintHud(); }, 0);
    }, true);
  }

  /* ── 长按 / 触摸 ──────────────────────────────────────── */
  function vibrate() {
    try {
      if (navigator && typeof navigator.vibrate === 'function') navigator.vibrate(12);
    } catch (err) {
      /* 不支持震动就算了 */
    }
  }

  function tapAction(i) {
    if (S.flagMode) flagCell(i);
    else revealCell(i);
  }

  function longAction(i) {
    if (S.flagMode) revealCell(i);
    else flagCell(i);
  }

  function cancelPress() {
    if (press) {
      if (press.timer !== null) clearTimeout(press.timer);
      if (press.cell && press.cell.classList) press.cell.classList.remove('down');
      press = null;
    }
  }

  function markPulse(i) {
    var d = cells[i];
    if (!d || !d.classList) return;
    d.classList.add('pulse');
    setTimeout(function () { d.classList.remove('pulse'); }, 360);
  }

  elBoard.addEventListener('pointerdown', function (e) {
    if (S.over || S.paused) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    var t = e.target && e.target.closest ? e.target.closest('.cell') : null;
    if (!t || !elBoard.contains(t)) return;

    var idx = parseInt(t.getAttribute('data-i'), 10);
    if (isNaN(idx)) return;

    cancelPress();
    if (t.classList) t.classList.add('down');
    press = {
      i: idx,
      cell: t,
      id: e.pointerId,
      x: typeof e.clientX === 'number' ? e.clientX : 0,
      y: typeof e.clientY === 'number' ? e.clientY : 0,
      long: false,
      timer: null
    };
    press.timer = setTimeout(function () {
      if (!press) return;
      press.long = true;
      /* 长按已经处理过了，随后浏览器补发的 contextmenu 别再插一次旗 */
      suppressCtxUntil = Date.now() + 900;
      longAction(idx);
      vibrate();
      markPulse(idx);
    }, LONG_PRESS_MS);
  });

  elBoard.addEventListener('pointermove', function (e) {
    if (!press) return;
    if (press.id !== undefined && e.pointerId !== undefined && press.id !== e.pointerId) return;
    var dx = (e.clientX || 0) - press.x;
    var dy = (e.clientY || 0) - press.y;
    /* 手指在动 = 想滚动棋盘，放弃长按 */
    if (dx * dx + dy * dy > 144) cancelPress();
  });

  elBoard.addEventListener('pointerup', function (e) {
    if (!press) return;
    var p = press;
    var wasLong = p.long;
    cancelPress();
    if (wasLong) return;

    var t = e.target && e.target.closest ? e.target.closest('.cell') : null;
    if (!t) return;
    var idx = parseInt(t.getAttribute('data-i'), 10);
    if (isNaN(idx) || idx !== p.i) return;
    tapAction(idx);
  });

  elBoard.addEventListener('pointercancel', cancelPress);
  elBoard.addEventListener('pointerleave', cancelPress);

  window.addEventListener('pointerup', cancelPress);

  elBoard.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    /* 长按路径已经插/拔过旗，避免一次长按被记两次 */
    if (Date.now() < suppressCtxUntil) return;
    var t = e.target && e.target.closest ? e.target.closest('.cell') : null;
    if (!t || S.over || S.paused) return;
    var idx = parseInt(t.getAttribute('data-i'), 10);
    if (!isNaN(idx)) flagCell(idx);
  });

  /* ── 键盘（可选：单 Tab 进入，方向键移动） ─────────────── */
  elBoard.addEventListener('keydown', function (e) {
    var t = e.target;
    if (!t || !t.classList || !t.classList.contains('cell')) return;
    var idx = parseInt(t.getAttribute('data-i'), 10);
    if (isNaN(idx)) return;

    var r = (idx / S.cols) | 0;
    var c = idx % S.cols;
    var nr = r;
    var nc = c;
    var handled = true;

    if (e.key === 'ArrowLeft') nc = Math.max(0, c - 1);
    else if (e.key === 'ArrowRight') nc = Math.min(S.cols - 1, c + 1);
    else if (e.key === 'ArrowUp') nr = Math.max(0, r - 1);
    else if (e.key === 'ArrowDown') nr = Math.min(S.rows - 1, r + 1);
    else if (e.key === 'Enter' || e.key === ' ') tapAction(idx);
    else if (e.key === 'f' || e.key === 'F') flagCell(idx);
    else handled = false;

    if (!handled) return;
    e.preventDefault();
    if (nr !== r || nc !== c) focusCell(nr * S.cols + nc);
  });

  /* ── 按钮 ─────────────────────────────────────────────── */
  var levelBtns = document.querySelectorAll('[data-level]');
  for (var li = 0; li < levelBtns.length; li++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        var lv = btn.getAttribute('data-level');
        if (lv && lv !== level) newGame(lv);
      });
    })(levelBtns[li]);
  }

  elRestart.addEventListener('click', function () { newGame(); });

  elFlagMode.addEventListener('click', function () {
    S.flagMode = !S.flagMode;
    elFlagMode.setAttribute('aria-pressed', S.flagMode ? 'true' : 'false');
    if (S.flagMode) elFlagMode.classList.add('primary');
    else elFlagMode.classList.remove('primary');
    paintHint();
  });

  /* ── 切后台就停表，回来接着算（读档暂停时保持暂停）───── */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      cancelPress();
      stopTimer();
      paintClock();
    } else if (S.started && !S.over && !S.won && !S.paused) {
      startTimer();
    }
  });

  window.addEventListener('pagehide', function () {
    cancelPress();
    stopTimer();
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer !== null) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      resizeTimer = null;
      layout();
    }, 120);
  });
  window.addEventListener('orientationchange', function () {
    layout();
  });

  /* ── 最高分行的格式 ─────────────────────────────────────
   * 记录是 {easy,medium,hard} 的用时；syncBest 已统一成毫秒，
   * 这里按秒取整显示 → "初级 42s · 中级 88s · 高级 260s"。
   */
  function formatBestRow(value) {
    var order = [
      ['easy', '初级'],
      ['medium', '中级'],
      ['hard', '高级']
    ];
    if (!value || typeof value !== 'object') return '暂无记录';
    var parts = [];
    for (var i = 0; i < order.length; i++) {
      var ms = normalizeBest(value[order[i][0]]);
      if (ms > 0) parts.push(order[i][1] + ' ' + Math.round(ms / 1000) + 's');
    }
    return parts.length ? parts.join(' · ') : '暂无记录';
  }

  /* 手机状态栏的颜色跟着明暗走，别在亮色页面顶一条黑边 */
  function paintMeta() {
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', Arcade.getMode('mines') === 'light' ? '#f4f6fa' : '#0b0d10');
  }

  /* ── 启动 ─────────────────────────────────────────────── */
  syncBest();
  newGame('easy');

  /* 共用运行时装配：座位（#mode / #score-row / .topbar）必须先存在 */
  Arcade.mountModeToggle(elMode, 'mines');
  paintMeta();
  if (elMode) {
    elMode.addEventListener('click', function () {
      /* mountModeToggle 的监听先执行，这里读到的已经是新值 */
      paintMeta();
    });
  }

  scoreRow = Arcade.mountScoreRow(elScoreRow, 'mines', { format: formatBestRow });
  wireScoreRow();

  slotStore = Arcade.mountSlots({
    gameId: 'mines',
    unit: 's',
    capture: capture,
    restore: restore,
    onPause: onPause
  });

  /* 有存档才出现一条提示；没有就安静 */
  paintResumeHint();
})();
</script>

</body>
</html>
